<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="TELLYSTRIKE">
  <defs>
    <linearGradient id="strike" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F81F7"/>
      <stop offset="1" stop-color="#17E0E0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#2F81F7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2F81F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141B26"/>
      <stop offset="1" stop-color="#0C121B"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="3" y="3" width="1194" height="294" rx="30" fill="#0A0E14" stroke="#1B2B44" stroke-width="2"/>
  <rect x="3" y="3" width="1194" height="294" rx="30" fill="url(#glow)"/>

  <!-- terminal mark -->
  <g transform="translate(70,78)">
    <rect x="0" y="0" width="150" height="144" rx="18" fill="url(#panel)" stroke="#223450" stroke-width="2"/>
    <circle cx="26" cy="26" r="6" fill="#2F81F7"/>
    <circle cx="48" cy="26" r="6" fill="#223450"/>
    <circle cx="70" cy="26" r="6" fill="#223450"/>
    <line x1="18" y1="48" x2="132" y2="48" stroke="#182435" stroke-width="2"/>
    <text x="24" y="116" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="60" font-weight="700" fill="url(#strike)">&gt;</text>
    <rect x="74" y="96" width="42" height="12" rx="3" fill="#17E0E0"/>
  </g>

  <!-- wordmark -->
  <g transform="skewX(-10)">
    <text x="300" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="104" font-weight="800" letter-spacing="-2" fill="#E6EDF3">TELLY<tspan fill="url(#strike)">STRIKE</tspan></text>
    <rect x="612" y="182" width="302" height="8" rx="2" fill="url(#strike)" opacity="0.92"/>
  </g>

  <!-- tagline -->
  <text x="262" y="232" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="23" letter-spacing="4" fill="#6E7681">// SECURITY SCAN FOR APPS YOU OWN</text>

  <!-- layers -->
  <text x="262" y="268" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="20" letter-spacing="3" fill="#3F5574">code &#183; deps &#183; mcp &#183; live &#183; ai-redteam</text>
</svg>
